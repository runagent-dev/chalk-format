name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # a real Postgres for the library server's highlights tests (the production driver, postgres.js, passes parameters differently from PGlite)
    # and for its runtime-login test (an owner migrates, a login with row rights only serves; logins are real only on a real server)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hltest
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: The library server's highlights on a real Postgres
        run: pnpm --filter @chalk-format/library-server exec vitest run src/highlights.test.ts
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/hltest
      - name: The library server on a real Postgres with an owner and a DML-only runtime login (MIGRATE_ON_START=false)
        run: pnpm --filter @chalk-format/library-server exec vitest run src/migrate.test.ts
        env:
          # a superuser: the test makes its own database and logins, and drops them after
          CHALK_LIBRARY_TEST_DB: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: JSON Schema is up to date with the model
        run: pnpm gen:schema && git diff --exit-code schema/
      - name: Shared lab library builds reproduce their keys (libraries/catalog.json)
        run: npx tsx tools/lab-libraries.ts --check
      - name: The four npm packages assemble and every import in them resolves
        run: node scripts/assemble-packages.mjs
